# Render.com Blueprint — one-click deploy spec for BCSI.
#
# This file is read by Render's "Deploy to Render" button (see README). When
# a user clicks the button, Render provisions everything below and starts the
# app. The user just supplies the Render account; no other setup needed.
#
# What gets provisioned
# ─────────────────────
#   • bcsi-web      — the FastAPI process (Docker-based, from the repo Dockerfile)
#   • bcsi-db       — managed Postgres (free tier; persistent disk)
#   • bcsi-redis    — managed Redis (free tier)
#
# After deploy, the live URL is bcsi-web.onrender.com (or similar).
#
# Cost: free tier sleeps after 15 min of inactivity (first request after sleep
# takes ~30s to wake). Paid tier is $7/mo for always-on. Postgres free tier is
# 1GB / 90-day retention. Redis free tier is 25MB.
#
# Notes on the env vars below
# ───────────────────────────
#   • generateValue: true  → Render generates a strong random secret at
#                            provision time (used for JWT_SECRET, ADMIN_PASSWORD)
#   • fromDatabase / fromService → Render wires up the connection strings
#                                   automatically; no manual paste needed
#   • sync: false  → values the operator should set themselves later via the
#                    Render dashboard (SMTP creds, Slack webhook, etc.)

services:
  # ── Web tier ────────────────────────────────────────────────────────────────
  - type: web
    name: bcsi-web
    runtime: docker
    plan: free                       # upgrade to "starter" ($7/mo) for always-on
    healthCheckPath: /api/v1/health
    dockerfilePath: ./Dockerfile
    autoDeploy: true                 # redeploy on every push to main
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      # Strong secrets generated by Render at provision time
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      # Wire up the managed Postgres + Redis automatically
      - key: DATABASE_URL
        fromDatabase:
          name: bcsi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bcsi-redis
          property: connectionString
      # The public base URL is auto-set to the bcsi-web service's URL
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: bcsi-web
          property: host
          envVarKey: RENDER_EXTERNAL_URL    # falls back to host if not set
      # Reasonable production defaults
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: LOG_FORMAT
        value: json
      # CORS must include the Vercel frontend domain when running split-deploy.
      # Replace the placeholder Vercel URL with your real one after deploy.
      # For a full Render deploy (frontend + backend on same domain), set to ""
      # or a strict allowlist of your domains — see DEPLOY-SPLIT.md.
      - key: CORS_ORIGINS
        value: "https://stock-analysis.vercel.app,http://localhost:3000,http://localhost:8000"
      # Optional — operator sets these after deploy if they want email/Slack alerts
      - key: ALERT_SMTP_HOST
        sync: false
      - key: ALERT_SMTP_USER
        sync: false
      - key: ALERT_SMTP_PASSWORD
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_SLACK_WEBHOOK
        sync: false

  # ── Redis ───────────────────────────────────────────────────────────────────
  - type: redis
    name: bcsi-redis
    plan: free                       # 25 MB, sufficient for the cache layer
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []                  # closed to public; only bcsi-web can reach

# ── Postgres ──────────────────────────────────────────────────────────────────
databases:
  - name: bcsi-db
    plan: free                       # 1 GB, 90-day backup retention
    databaseName: bcsi
    user: bcsi
    ipAllowList: []                  # closed to public; only bcsi-web can reach
