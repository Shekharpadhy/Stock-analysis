name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel earlier runs of the same branch on push — saves CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit + integration tests ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      # Redis is optional at runtime (cache layer falls through when down),
      # but bringing it up means we exercise the real cache path in tests.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # XGBoost on Linux needs libgomp; pre-installed on ubuntu-latest but
      # spelled out here so future runners that lose it surface a clear error.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest (unit + service tests)
        env:
          SCHEDULER_ENABLED: "false"
          APP_ENV: "test"
        run: |
          pytest tests/ \
            --ignore=tests/integration \
            -v --tb=short \
            --cov=backend --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false       # don't block PRs on the upload itself

  # ── Optional lint job (non-blocking until codebase is fully cleaned up) ────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true             # advisory until we enforce

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tooling
        run: pip install ruff==0.5.5

      - name: Ruff (style + bugbear)
        run: ruff check backend/ --select=E,F,B,W --line-length=100
