name: refresh-snapshots

# Nightly job that populates the showcase + pending-queue tickers with
# full-fidelity analysis snapshots.  Runs from GitHub-hosted runners whose
# IPs are not on Yahoo's cloud-IP block-list as aggressively as Render's, so
# yfinance works reliably here even though it doesn't from production.
#
# What it does
# ────────────
# 1. Checks out the repo
# 2. Installs Python deps
# 3. Runs `python -m backend.cli.refresh_showcase` which:
#       a) refreshes every ticker in SHOWCASE_TICKERS (~107 tickers)
#       b) drains the pending_snapshots queue (tickers users searched
#          since the last run that don't yet have a snapshot)
# 4. Prints a JSON summary to the action log
#
# Required GitHub repo secrets
# ────────────────────────────
#   DATABASE_URL   — External URL of the Render Postgres instance
#                    (Render → bcsi-db → Info → External Database URL)
#   FMP_API_KEY    — Financial Modeling Prep API key (optional but
#                    recommended; without it the run uses yfinance only)
#
# Set both in: GitHub repo → Settings → Secrets and variables → Actions

on:
  schedule:
    # 03:00 UTC every day = 08:30 IST = ~10pm-11pm US Eastern (after US close)
    - cron: '0 3 * * *'
  workflow_dispatch:        # also runnable on-demand from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary

      - name: Refresh showcase + drain pending queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY:  ${{ secrets.FMP_API_KEY }}
          APP_ENV:      production
          # Don't trip the in-process scheduler when invoking the CLI
          SCHEDULER_ENABLED: 'false'
          # Avoid the prod-config fail-fast — the CLI never serves traffic
          JWT_SECRET:     dummy-cli-secret-not-used-by-cli
          ADMIN_PASSWORD: dummy-cli-password-not-used-by-cli
        run: |
          python -m backend.cli.refresh_showcase --migrate
