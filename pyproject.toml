[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-client-sector-intelligence"
version = "0.1.0"
description = "AI-powered sector risk intelligence for banking clients"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shekhar Padhy"}]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
