[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-client-sector-intelligence"
version = "0.5.0"
description = "AI-powered sector risk intelligence for banking clients"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shekhar Padhy"}]

# Runtime dependencies — mirrors requirements.txt.  Keep the two in sync;
# requirements.txt remains the source of truth for `pip install -r ...`,
# pyproject.toml supports `pip install -e .` for development workflows.
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "gunicorn==21.2.0",
    "sqlalchemy==2.0.29",
    "yfinance==0.2.54",
    "pandas==2.2.1",
    "numpy==1.26.4",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "scikit-learn==1.4.1.post1",
    "xgboost==2.1.4",
    "shap==0.49.1",
    "joblib==1.5.3",
    "requests==2.31.0",
    "aiohttp==3.9.3",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",
    "redis==5.0.3",
    "slowapi==0.1.9",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "argon2-cffi==25.1.0",
    "apscheduler==3.11.2",
    "python-multipart==0.0.9",
    "python-dateutil==2.9.0",
]

[project.optional-dependencies]
# Install with: `pip install -e .[dev]`
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "fakeredis==2.21.3",
    "ruff==0.5.5",
]

[project.urls]
Repository = "https://github.com/shakesss/banking-client-sector-intelligence"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*", "frontend*", "alembic*", "data*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["E501"]   # long-line offences are common and acceptable

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
